<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branding</title>
  <link rel="icon" type="image/png" href="/icons/ico.png"/>
  <link rel="stylesheet" href="/style.css"/>
  <script src="/layout.js" defer></script>
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="page">
    <div class="panel">
  
      <h1>Branding v3.7</h1>
  
      <section class="section">
        <h2>Colors</h2>
        
        <h4 class="palette-title">Greyscale Palette</h4>
        <div class="color-palette" id="greyscale-palette">
          <!-- Swatches will be generated by JavaScript -->
        </div>

        <h4 class="palette-title">Accent Palette</h4>
        <div class="color-palette" id="accent-palette">
          <!-- Swatches will be generated by JavaScript -->
        </div>

        <h4 class="palette-title">Gradient Palette (45°)</h4>
        <div class="color-palette" id="gradient-palette">
          <!-- Swatches will be generated by JavaScript -->
        </div>

      </section>
  
    </div>
  </main>
  <div id="footer-placeholder"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rootStyles = getComputedStyle(document.body);

      // --- Helper Function to create a swatch ---
      const createSwatch = (container, { name, background, info }) => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        
        swatch.innerHTML = `
          <div class="swatch-preview" style="background: ${background};"></div>
          <div class="swatch-info">
            <h4>${name}</h4>
            <div class="color-codes">
              ${info}
            </div>
          </div>
        `;
        container.appendChild(swatch);
      };

      // --- 1. Greyscale Palette ---
      const greyscalePalette = document.getElementById('greyscale-palette');
      for (let i = 0; i <= 5; i++) {
        const rgbVar = `--color-${i}-rgb`;
        const rgbValue = rootStyles.getPropertyValue(rgbVar).trim();
        createSwatch(greyscalePalette, {
          name: `Color ${i}`,
          background: `var(--color-${i})`,
          info: `<p>RGB: <code class="copyable">${rgbValue}</code></p>`
        });
      }

      // --- 2. Accent Palette ---
      const accentPalette = document.getElementById('accent-palette');
      const accentColors = [
        { id: 'g', name: 'Nom à trouver' },
        { id: 'b', name: 'Nom à trouver' },
        { id: 'r', name: 'Nom à trouver' },
        { id: 'v', name: 'Variable' }
      ];

      accentColors.forEach(color => {
        const h = rootStyles.getPropertyValue(`--color-a-${color.id}-h`).trim();
        const s = rootStyles.getPropertyValue(`--color-a-${color.id}-s`).trim();
        const l = rootStyles.getPropertyValue(`--color-a-${color.id}-l`).trim();
        const hslString = `${h}, ${s}, ${l}`;

        createSwatch(accentPalette, {
          name: color.name,
          background: `var(--color-a-${color.id})`,
          info: `<p>HSL: <code class="copyable">${hslString}</code></p>`
        });
      });

      // --- 3. Gradient Palette ---
      const gradientPalette = document.getElementById('gradient-palette');
      const hueShift = rootStyles.getPropertyValue('--gradient-hue-shift').trim();
      const lightnessShift = rootStyles.getPropertyValue('--gradient-lightness-shift').trim();

      accentColors.forEach(color => {
        createSwatch(gradientPalette, {
          name: color.name,
          background: `var(--color-a-${color.id}-g)`,
          info: `
            <p>Hue Shift: <code class="copyable">±${hueShift}</code></p>
            <p>Lightness Shift: <code class="copyable">±${lightnessShift}</code></p>
          `
        });
      });

      // --- Activate clipboard functionality for all new elements ---
      document.querySelectorAll('.copyable').forEach(el => {
        const originalText = el.textContent;
        el.addEventListener('click', () => {
          navigator.clipboard.writeText(originalText).then(() => {
            el.textContent = 'Copied!';
            setTimeout(() => { el.textContent = originalText; }, 1500);
          }).catch(err => { console.error('Failed to copy text: ', err); });
        });
      });
    });
  </script>

</body>
</html>
