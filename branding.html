<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branding</title>
  <link rel="icon" type="image/png" href="/icons/ico.png"/>
  <link rel="stylesheet" href="/style.css"/>
  <script src="/layout.js" defer></script>
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="page">
    <div class="panel">
  
      <h1>Branding v3.7</h1>
  
      <section class="section">
        <h2>Colors</h2>
        
        <h4 class="palette-title">Greyscale Palette</h4>
        <div class="color-palette" id="greyscale-palette">
          <!-- Swatches will be generated by JavaScript -->
        </div>

        <h4 class="palette-title">Accent Palette</h4>
        <!-- Description for the variable color will be inserted here -->
        <div class="color-palette" id="accent-palette">
          <!-- Swatches will be generated by JavaScript -->
        </div>

        <h4 class="palette-title">Gradient Palette</h4>
        <!-- Gradient generation rules will be inserted here -->
        <div class="color-palette" id="gradient-palette">
          <!-- Swatches will be generated by JavaScript -->
        </div>

      </section>
  
    </div>
  </main>
  <div id="footer-placeholder"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rootStyles = getComputedStyle(document.body);

      // --- Helper Function to create a swatch ---
      const createSwatch = (container, { name, background, info }) => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.innerHTML = `
          <div class="swatch-preview" style="background: ${background};"></div>
          <div class="swatch-info">
            <h4>${name}</h4>
            ${info ? `<div class="color-codes">${info}</div>` : ''}
          </div>
        `;
        container.appendChild(swatch);
      };

      // --- 1. Greyscale Palette ---
      const greyscalePalette = document.getElementById('greyscale-palette');
      for (let i = 0; i <= 5; i++) {
        const rgbVar = `--color-${i}-rgb`;
        const rgbValue = rootStyles.getPropertyValue(rgbVar).trim();
        createSwatch(greyscalePalette, {
          name: `Color ${i}`,
          background: `var(--color-${i})`,
          info: `<p>RGB: <code class="copyable">${rgbValue}</code></p>`
        });
      }
      
      // --- 2. Accent Palette ---
      const accentPalette = document.getElementById('accent-palette');
      const accentTitle = accentPalette.previousElementSibling;
      const variableDesc = document.createElement('p');
      variableDesc.className = 'palette-description';
      variableDesc.innerHTML = 'The <strong>Variable</strong> color is a dynamic accent used throughout the site. It can be changed to match a specific project\'s mood or for special events, providing contextual theming.';
      accentTitle.insertAdjacentElement('afterend', variableDesc);

      const accentColors = [
        { id: 'g', name: 'Jade' },
        { id: 'b', name: 'Cobalt' },
        { id: 'r', name: 'Garnet' },
        { id: 'v', name: 'Variable' }
      ];

      accentColors.forEach(color => {
        const h = rootStyles.getPropertyValue(`--color-a-${color.id}-h`).trim();
        const s = rootStyles.getPropertyValue(`--color-a-${color.id}-s`).trim();
        const l = rootStyles.getPropertyValue(`--color-a-${color.id}-l`).trim();
        const hslString = `${h}, ${s}, ${l}`;

        createSwatch(accentPalette, {
          name: color.name,
          background: `var(--color-a-${color.id})`,
          info: `<p>HSL: <code class="copyable">${hslString}</code></p>`
        });
      });

      // --- 3. Gradient Palette ---
      const gradientPalette = document.getElementById('gradient-palette');
      const gradientTitle = gradientPalette.previousElementSibling;
      const hueShift = rootStyles.getPropertyValue('--gradient-hue-shift').trim();
      const lightnessShift = rootStyles.getPropertyValue('--gradient-lightness-shift').trim();
      const angle = rootStyles.getPropertyValue('--gradient-angle').trim();
      
      const gradientDesc = document.createElement('p');
      gradientDesc.className = 'palette-description';
      gradientDesc.innerHTML = `Generated with: <strong>${angle}</strong> angle, Hue Shift <strong>±${hueShift}</strong>, Lightness Shift <strong>±${lightnessShift}</strong>.`;
      gradientTitle.insertAdjacentElement('afterend', gradientDesc);

      accentColors.forEach(color => {
        createSwatch(gradientPalette, {
          name: color.name,
          background: `var(--color-a-${color.id}-g)`,
          info: `<p>CSS: <code class="copyable-gradient" data-variable="--color-a-${color.id}-g">calculated</code></p>`
        });
      });

      // --- Activate clipboard functionality ---
      // For simple text values (RGB, HSL)
      document.querySelectorAll('.copyable').forEach(el => {
        const originalText = el.textContent;
        el.addEventListener('click', () => {
          navigator.clipboard.writeText(originalText).then(() => {
            el.textContent = 'Copied!';
            setTimeout(() => { el.textContent = originalText; }, 1500);
          });
        });
      });

      // For calculated gradient values
      document.querySelectorAll('.copyable-gradient').forEach(el => {
        el.addEventListener('click', () => {
          const cssVariable = el.dataset.variable;
          const calculatedValue = rootStyles.getPropertyValue(cssVariable).trim();
          navigator.clipboard.writeText(calculatedValue).then(() => {
            const originalText = el.textContent;
            el.textContent = 'Copied!';
            setTimeout(() => { el.textContent = originalText; }, 1500);
          });
        });
      });
    });
  </script>

</body>
</html>
