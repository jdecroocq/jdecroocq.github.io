<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branding</title>
  <link rel="icon" type="image/png" href="/icons/ico.png"/>
  <link rel="stylesheet" href="/style.css"/>
  <script src="/layout.js" defer></script>
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="page">
    <div class="panel">
  
      <h1>Branding v3.7</h1>
  
      <section class="section">
        <h2>Colors</h2>
        
        <h4 class="palette-title">Greyscale Palette</h4>
        <div class="color-palette" id="greyscale-palette"></div>

        <h4 class="palette-title">Accent Palette</h4>
        <div class="color-palette" id="accent-palette"></div>

        <h4 class="palette-title">Gradient Palette</h4>
        <div class="color-palette" id="gradient-palette"></div>

      </section>
  
    </div>
  </main>
  <div id="footer-placeholder"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rootStyles = getComputedStyle(document.body);

      // --- Helper Function to create tooltips ---
      const createTooltip = (text) => {
        return `
          <span class="tooltip-wrapper">
            <span class="tooltip-trigger">?</span>
            <span class="tooltip-content">${text}</span>
          </span>`;
      };

      // --- Helper Function to create a swatch ---
      const createSwatch = (container, { name, background, info }) => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.innerHTML = `
          <div class="swatch-preview" style="background: ${background};"></div>
          <div class="swatch-info">
            <h4>${name}</h4>
            ${info ? `<div class="color-codes">${info}</div>` : ''}
          </div>
        `;
        container.appendChild(swatch);
      };

      // --- 1. Greyscale Palette ---
      const greyscalePalette = document.getElementById('greyscale-palette');
      for (let i = 0; i <= 5; i++) {
        const rgbValue = rootStyles.getPropertyValue(`--color-${i}-rgb`).trim();
        createSwatch(greyscalePalette, { name: `Color ${i}`, background: `var(--color-${i})`, info: `<p>RGB: <code class="copyable">${rgbValue}</code></p>` });
      }
      
      // --- 2. Accent Palette ---
      const accentTitle = document.querySelector('#accent-palette').previousElementSibling;
      const variableTooltipText = 'The Variable color is a dynamic accent used throughout the site. It can be changed to match a specific project\'s mood or for special events, providing contextual theming.';
      accentTitle.innerHTML += createTooltip(variableTooltipText);
      
      const accentColors = [{ id: 'g', name: 'Jade' }, { id: 'b', name: 'Cobalt' }, { id: 'r', name: 'Garnet' }, { id: 'v', name: 'Variable' }];
      const accentPalette = document.getElementById('accent-palette');
      accentColors.forEach(color => {
        const h = rootStyles.getPropertyValue(`--color-a-${color.id}-h`).trim();
        const s = rootStyles.getPropertyValue(`--color-a-${color.id}-s`).trim();
        const l = rootStyles.getPropertyValue(`--color-a-${color.id}-l`).trim();
        createSwatch(accentPalette, { name: color.name, background: `var(--color-a-${color.id})`, info: `<p>HSL: <code class="copyable">${h}, ${s}, ${l}</code></p>` });
      });

      // --- 3. Gradient Palette ---
      const gradientTitle = document.querySelector('#gradient-palette').previousElementSibling;
      const hueShift = rootStyles.getPropertyValue('--gradient-hue-shift').trim();
      const lightnessShift = rootStyles.getPropertyValue('--gradient-lightness-shift').trim();
      const angle = rootStyles.getPropertyValue('--gradient-angle').trim();
      const gradientTooltipText = `Generated with: ${angle} angle, Hue Shift ±${hueShift}, Lightness Shift ±${lightnessShift}.`;
      gradientTitle.innerHTML += createTooltip(gradientTooltipText);
      
      const gradientPalette = document.getElementById('gradient-palette');
      accentColors.forEach(color => {
        createSwatch(gradientPalette, { name: color.name, background: `var(--color-a-${color.id}-g)`, info: `<p>HSL: <code class="copyable-gradient" data-variable="--color-a-${color.id}-g">calculated</code></p>` });
      });

      // --- Activate clipboard functionality ---
      document.querySelectorAll('.copyable, .copyable-gradient').forEach(el => {
        el.addEventListener('click', () => {
          const originalText = el.textContent;
          const isGradient = el.classList.contains('copyable-gradient');
          const textToCopy = isGradient ? rootStyles.getPropertyValue(el.dataset.variable).trim() : originalText;
          
          navigator.clipboard.writeText(textToCopy).then(() => {
            el.textContent = 'Copied!';
            setTimeout(() => { el.textContent = originalText; }, 1500);
          });
        });
      });
    });
  </script>

</body>
</html>
