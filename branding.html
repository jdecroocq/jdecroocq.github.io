<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branding</title>
  <link rel="icon" type="image/png" href="/icons/ico.png"/>
  <link rel="stylesheet" href="/style.css"/>
  <script src="/layout.js" defer></script>
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="page">
    <div class="panel">
  
      <h1>Branding</h1>
  
      <section class="section">
        <h2>Colors</h2>
        
        <h4>Greyscale Palette</h4>
        <div class="color-palette">
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-5);"></div>
            <div class="swatch-info"><h4>Color 5</h4></div>
          </div>
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-4);"></div>
            <div class="swatch-info"><h4>Color 4</h4></div>
          </div>
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-3);"></div>
            <div class="swatch-info"><h4>Color 3</h4></div>
          </div>
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-2);"></div>
            <div class="swatch-info"><h4>Color 2</h4></div>
          </div>
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-1);"></div>
            <div class="swatch-info"><h4>Color 1</h4></div>
          </div>
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-0);"></div>
            <div class="swatch-info"><h4>Color 0</h4></div>
          </div>
        </div>

        <h4>Accent Palette</h4>
        <div class="color-palette">
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-a-g);"></div>
            <div class="swatch-info"><h4>Nom à trouver</h4></div>
          </div>
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-a-b);"></div>
            <div class="swatch-info"><h4>Nom à trouver</h4></div>
          </div>
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-a-r);"></div>
            <div class="swatch-info"><h4>Nom à trouver</h4></div>
          </div>
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-a-v);"></div>
            <div class="swatch-info"><h4>Variable</h4></div>
          </div>
        </div>

        <h4>Gradient Palette</h4>
        <div class="color-palette">
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-a-g-g);"></div>
            <div class="swatch-info"><h4>Nom à trouver</h4></div>
          </div>
           <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-a-b-g);"></div>
            <div class="swatch-info"><h4>Nom à trouver</h4></div>
          </div>
           <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-a-r-g);"></div>
            <div class="swatch-info"><h4>Nom à trouver</h4></div>
          </div>
          <div class="color-swatch">
            <div class="swatch-preview" style="background: var(--color-a-v-g);"></div>
            <div class="swatch-info"><h4>Variable</h4></div>
          </div>
        </div>

      </section>
  
    </div>
  </main>
  <div id="footer-placeholder"></div>
</body>
</html>
